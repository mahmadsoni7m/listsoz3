name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK licenses
        run: |
          SDKM=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1)
          yes | "$SDKM" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Download handwriting fonts (OFL)
        run: |
          D=app/src/main/assets/fonts
          B=https://github.com/google/fonts/raw/main/ofl
          # get <файл> <роҳи 1> [роҳи 2 ...] — аввалин роҳи кории рӯйхат истифода мешавад
          get() {
            out="$1"; shift
            for path in "$@"; do
              if curl -fsSL --retry 2 -o "$D/$out" "$B/$path"; then
                echo "OK $out <- $path ($(stat -c%s "$D/$out") bytes)"
                return 0
              fi
            done
            rm -f "$D/$out"
            echo "::warning::Шрифт $out зеркашӣ нашуд"
            return 0
          }
          get natural.ttf "badscript/BadScript-Regular.ttf"
          get beautiful.ttf "marckscript/MarckScript-Regular.ttf"
          get clean.ttf "neucha/Neucha.ttf" "neucha/Neucha-Regular.ttf" "pangolin/Pangolin-Regular.ttf" "caveat/Caveat%5Bwght%5D.ttf"
          # Агар шрифти «clean» наёфт, аз «natural» нусха мегирем, то услуб кор кунад
          if [ ! -f "$D/clean.ttf" ] && [ -f "$D/natural.ttf" ]; then cp "$D/natural.ttf" "$D/clean.ttf"; echo "::warning::clean.ttf = natural.ttf (нусха)"; fi
          ls -la "$D"

      - name: Unit tests
        run: gradle --no-daemon testDebugUnitTest

      - name: Lint
        run: gradle --no-daemon lintDebug

      - name: Build Debug APK
        run: gradle --no-daemon assembleDebug

      - name: Rename Debug APK
        run: cp app/build/outputs/apk/debug/app-debug.apk ListSoz.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ListSoz-APK
          path: ListSoz.apk

      - name: Decode keystore
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build Release APK
        if: env.KEYSTORE_BASE64 != ''
        run: |
          gradle --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ListSoz-release.apk

      - name: Upload Release APK
        if: env.KEYSTORE_BASE64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: ListSoz-RELEASE-APK
          path: ListSoz-release.apk

      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
